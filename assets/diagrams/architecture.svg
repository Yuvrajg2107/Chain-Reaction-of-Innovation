<text x="55" y="924" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#143449">Planning diagram, 12 October 2026. Components are not implemented.</text>
<text x="55" y="959" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#143449">The six entity types organize knowledge; they do not impose a linear physical hierarchy.</text>
